name: RPEngine
main: ai.resourcepack.engine.RPEnginePlugin
version: ${version}
api-version: '1.21'
description: Custom items, blocks, furniture, models and more, from a content folder.
author: ResourcePack AI
folia-supported: false

commands:
  rpengine:
    description: Manage RP Engine content and bundles.
    usage: /rpengine <reload|info|bundles|items|give|models|purge|sounds|sound|icons|say|push>
    aliases: [rpe, rp]
    permission: rpengine.admin

permissions:
  rpengine.admin:
    description: Use /rpengine.
    default: op
