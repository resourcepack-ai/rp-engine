name: RPEngine
main: ai.resourcepack.engine.RPEnginePlugin
version: ${version}
api-version: '1.19'
description: Custom items, models, sounds, icons, screens, recipes and emotes.
author: ResourcePack AI
folia-supported: false
softdepend: [Geyser-Spigot, PlaceholderAPI, MythicMobs, WorldGuard, Citizens]

commands:
  rpengine:
    description: Manage RP Engine content.
    usage: /<command> <reload|info|bundles|items|item|give|blocks|models|purge|sounds|sound|icons|say|effects|effect|vfx|cast|screens|screen|hud|shaders|shader|dialogs|dialog|var|page|slot|click|quick|recipes|emote|emotes|entities|spawn|bind|unbind|liquid|vehicles|vehicle|objects|object|armor|edit|sync|distribute|push>
    aliases: [rpe, rp]
    # No permission on the command itself. Each subcommand checks its
    # own rpengine.<name>; see permissionFor in RPEnginePlugin.
  emote:
    description: Play an emote.
    usage: /<command> <name|stop> [player...]
    permission: rpengine.emote
  emotereply:
    description: Answer an emote invitation.
    usage: /<command> <accept|deny> <token>
    # Deliberately ungated: it can only answer an invitation somebody
    # was already sent, and a player who cannot reply is a player who
    # cannot decline being pulled into an emote.

permissions:
  rpengine.admin:
    description: Everything. A convenience parent, not a node anything checks.
    default: op
    children:
      rpengine.reload: true
      rpengine.info: true
      rpengine.bundles: true
      rpengine.items: true
      rpengine.item: true
      rpengine.give: true
      rpengine.models: true
      rpengine.blocks: true
      rpengine.purge: true
      rpengine.sounds: true
      rpengine.sound: true
      rpengine.icons: true
      rpengine.say: true
      rpengine.effects: true
      rpengine.effect: true
      rpengine.vfx: true
      rpengine.cast: true
      rpengine.screens: true
      rpengine.screen: true
      rpengine.dialogs: true
      rpengine.dialog: true
      rpengine.var: true
      rpengine.page: true
      rpengine.slot: true
      rpengine.click: true
      rpengine.quick: true
      rpengine.hud: true
      rpengine.shaders: true
      rpengine.shader: true
      rpengine.recipes: true
      rpengine.emote: true
      rpengine.emotes: true
      rpengine.entities: true
      rpengine.spawn: true
      rpengine.bind: true
      rpengine.unbind: true
      rpengine.liquid: true
      rpengine.vehicles: true
      rpengine.vehicle: true
      rpengine.objects: true
      rpengine.object: true
      rpengine.object.spawn: true
      rpengine.object.state: true
      rpengine.object.replay: true
      rpengine.object.play: true
      rpengine.object.stop: true
      rpengine.object.move: true
      rpengine.object.turn: true
      rpengine.object.size: true
      rpengine.object.seed: true
      rpengine.object.remove: true
      rpengine.armor: true
      rpengine.edit: true
      rpengine.sync: true
      rpengine.distribute: true
      rpengine.push: true
      rpengine.emote.cast: true
      rpengine.emote.force: true
      rpengine.sound.others: true
      rpengine.screen.others: true
      rpengine.hud.others: true
      rpengine.shader.others: true
      rpengine.dialog.others: true
      rpengine.var.others: true
      rpengine.armor.others: true
      rpengine.bind.others: true
      rpengine.unbind.others: true
      rpengine.cast.others: true
      rpengine.cast.at: true
      rpengine.update: true
      rpengine.shaders: true
  rpengine.reload:
    description: Reload content and config.
    default: op
  rpengine.update:
    description: Be told on joining when a newer RP Engine is on SpigotMC.
    default: op
  rpengine.shaders:
    description: Be told when another plugin's pack replaces a core shader that RP Engine's packs also replace.
    default: op
  rpengine.info:
    description: See what this server holds.
    default: op
  rpengine.bundles:
    description: List the built packs.
    default: op
  rpengine.items:
    description: List the custom items.
    default: op
  rpengine.item:
    description: Open the item menu (/rp item menu) and take items from it.
    default: op
  rpengine.give:
    description: Give yourself a custom item.
    default: op
  rpengine.blocks:
    description: List the custom blocks, and how many states are left.
    default: op
  rpengine.models:
    description: List placed models nearby.
    default: op
  rpengine.purge:
    description: Remove orphaned placed models.
    default: op
  rpengine.sounds:
    description: List the custom sounds.
    default: op
  rpengine.sound:
    description: Play a custom sound to yourself.
    default: op
  rpengine.sound.others:
    description: Play a custom sound to somebody else.
    default: op
  rpengine.icons:
    description: List the icons.
    default: op
  rpengine.say:
    description: Send yourself text with icons in it.
    default: op
  rpengine.effects:
    description: List the Text Effects and the presets.
    default: op
  rpengine.effect:
    description: Send yourself text in a Text Effect.
    default: op
  rpengine.vfx:
    description: List the VFX and the presets.
    default: op
  rpengine.cast:
    description: Play a VFX where you stand, and stop every VFX playing.
    default: op
  rpengine.cast.others:
    description: Play a VFX where somebody else stands.
    default: op
  rpengine.cast.at:
    description: Play a VFX at any place, in any world, cast by nobody (/rp cast <name> at <x> <y> <z>).
    default: op
  rpengine.chat.effects.all:
    # One effect is rpengine.chat.effects.<name>, which cannot be listed here
    # because the names are the server's own.
    description: "Use every Text Effect in chat, as <fx:name>text</fx>."
    default: op
  rpengine.screens:
    description: List the screens and HUDs.
    default: op
  rpengine.screen:
    description: Open a custom screen on yourself.
    default: op
  rpengine.screen.others:
    description: Open a custom screen on somebody else.
    default: op
  rpengine.dialogs:
    description: List the dialogs.
    default: op
  rpengine.dialog:
    description: Open a dialog on yourself - including one about somebody else (target=Steve).
    default: op
  rpengine.dialog.others:
    description: Open a dialog on somebody else's screen.
    default: op
  rpengine.var:
    # Everybody, and it has to be: a click on a bound control in a dialog
    # runs /rp var as the player who clicked it. It can only set a variable
    # some loaded dialog declares, to a value that dialog lists, and only
    # for the player running it - see DialogVariables.
    description: Change your own dialog settings - what a click on a dialog's switch or slider runs.
    default: true
  rpengine.var.others:
    description: Change somebody else's dialog settings.
    default: op
  rpengine.quick:
    # Everybody, for rpengine.var's reason: the button on a quick action's
    # launcher (the Quick Actions key, G) runs /rp quick as the player who
    # pressed it. It only opens a dialog that is on the key, and that
    # dialog's own permission still applies.
    description: Open a dialog on the Quick Actions key - what a quick action's launcher runs.
    default: true
  rpengine.page:
    # Everybody, for rpengine.var's reason: a click on a paged dialog's
    # sidebar runs /rp page as the player who clicked it. It only opens a
    # dialog the one they were last shown links to with exactly that
    # command - see DialogLinks.
    description: Turn a dialog to another of its pages - what a click on a paged dialog's sidebar runs.
    default: true
  rpengine.click:
    # Everybody, for rpengine.page's reason: a "Run as console" button in a
    # dialog runs /rp click as the player who clicked it, and the engine runs
    # the button's command as the console. Only a click the dialog they were
    # last shown holds runs anything, and the command never reaches the
    # client - see DialogsImpl.consoleCommand.
    description: Press a dialog's console button - what a "Run as console" button runs.
    default: true
  rpengine.slot:
    # Everybody, for rpengine.page's reason: a click on a slot of a dialog
    # whose items move runs /rp slot as the player who clicked it. It only
    # moves the player's own items, and only between slots the dialog they
    # were last shown has that exact click for - see DialogSlots.
    description: Move an item in a dialog - what a click on a slot whose items move runs.
    default: true
  rpengine.hud:
    description: Draw a HUD overlay on yourself.
    default: op
  rpengine.hud.others:
    description: Draw or clear a HUD overlay on somebody else.
    default: op
  rpengine.shaders:
    description: List the Studio shader objects.
    default: op
  rpengine.shader:
    description: Show a Studio shader object on yourself.
    default: op
  rpengine.shader.others:
    description: Show or clear a Studio shader object on somebody else.
    default: op
  rpengine.recipes:
    description: List the recipes.
    default: op
  rpengine.emote:
    description: Play an emote.
    default: true
  rpengine.emotes:
    description: List the emotes.
    default: true
  rpengine.entities:
    description: List the custom entities.
    default: op
  rpengine.spawn:
    description: Spawn a custom entity.
    default: op
  rpengine.chat.icons:
    # Quoted, and it has to stay quoted: a plain YAML scalar ends at the first
    # colon-space, so `:name: shortcodes` reads as a nested mapping and the
    # whole file fails to parse. That is not a bad permission line, it is a
    # server that will not boot at all — see PluginYmlTest.
    description: "Use :name: shortcodes for icons in chat."
    default: true
  rpengine.bind:
    description: Put a model on a mob that already exists.
    default: op
  rpengine.bind.others:
    description: Put a model on another PLAYER. A mob needs only rpengine.bind.
    default: op
  rpengine.unbind:
    description: Take a bound model back off.
    default: op
  rpengine.unbind.others:
    description: Take a bound model off another player.
    default: op
  rpengine.liquid:
    description: Mark out pools of a custom liquid.
    default: op
  rpengine.vehicles:
    description: List the vehicles this server has.
    default: op
  rpengine.vehicle:
    description: Park a vehicle, or take one away.
    default: op
  rpengine.objects:
    description: List the 3D shader objects this server has.
    default: op
  rpengine.object:
    description: Every /rp object verb. Each also has its own node.
    default: op
    children:
      rpengine.object.spawn: true
      rpengine.object.state: true
      rpengine.object.replay: true
      rpengine.object.play: true
      rpengine.object.stop: true
      rpengine.object.move: true
      rpengine.object.turn: true
      rpengine.object.size: true
      rpengine.object.seed: true
      rpengine.object.remove: true
  rpengine.object.spawn:
    description: Put a 3D object down.
    default: op
  rpengine.object.state:
    description: Change the state of the 3D object nearest you.
    default: op
  rpengine.object.replay:
    description: Play the state of the 3D object nearest you again.
    default: op
  rpengine.object.play:
    description: Run a sequence on the 3D object nearest you.
    default: op
  rpengine.object.stop:
    description: Stop the sequence and moves of the 3D object nearest you.
    default: op
  rpengine.object.move:
    description: Move the 3D object nearest you.
    default: op
  rpengine.object.turn:
    description: Turn the 3D object nearest you.
    default: op
  rpengine.object.size:
    description: Resize the 3D object nearest you.
    default: op
  rpengine.object.seed:
    description: Change the seed of the 3D object nearest you.
    default: op
  rpengine.object.remove:
    description: Take 3D objects away.
    default: op
  rpengine.armor:
    description: Put on and look at 3D armour yourself.
    default: op
  rpengine.armor.others:
    description: Dress somebody else in 3D armour, or hand them a set.
    default: op
  rpengine.edit:
    description: >
      Open this server's own content in the editors at resourcepack.ai, and
      write what you change back onto this machine. A real permission rather
      than a convenience: whoever has it can rewrite files in the content
      folder from a browser.
    default: op
  rpengine.sync:
    description: Live-test a pack from Studio, and share it.
    default: op
  rpengine.distribute:
    description: Serve a published pack to everybody who joins this server.
    default: op
  rpengine.push:
    description: Re-send this server's pack to yourself.
    default: op
  rpengine.emote.cast:
    description: Pull other players into an emote. They are still asked first.
    default: op
  rpengine.emote.force:
    description: Pull other players in WITHOUT asking them.
    # Not a child of rpengine.emote.cast: holding one is being allowed
    # to ask, holding the other is being allowed to skip the asking,
    # and a server that granted the first has not agreed to the second.
    default: op
