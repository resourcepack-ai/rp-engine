name: RPEngine
main: ai.resourcepack.engine.RPEnginePlugin
version: ${version}
api-version: '1.19'
description: Custom items, models, sounds, icons, screens, recipes and emotes.
author: ResourcePack AI
folia-supported: false
softdepend: [Geyser-Spigot, PlaceholderAPI, MythicMobs, WorldGuard, Citizens]

commands:
  rpengine:
    description: Manage RP Engine content.
    usage: /<command> <reload|info|bundles|items|give|blocks|models|purge|sounds|sound|icons|say|screens|screen|hud|shaders|shader|dialogs|dialog|var|page|recipes|emote|emotes|entities|spawn|bind|unbind|liquid|vehicles|vehicle|armor|edit|sync|distribute|push>
    aliases: [rpe, rp]
    # No permission on the command itself. Each subcommand checks its
    # own rpengine.<name>; see permissionFor in RPEnginePlugin.
  emote:
    description: Play an emote.
    usage: /<command> <name|stop> [player...]
    permission: rpengine.emote
  emotereply:
    description: Answer an emote invitation.
    usage: /<command> <accept|deny> <token>
    # Deliberately ungated: it can only answer an invitation somebody
    # was already sent, and a player who cannot reply is a player who
    # cannot decline being pulled into an emote.

permissions:
  rpengine.admin:
    description: Everything. A convenience parent, not a node anything checks.
    default: op
    children:
      rpengine.reload: true
      rpengine.info: true
      rpengine.bundles: true
      rpengine.items: true
      rpengine.give: true
      rpengine.models: true
      rpengine.blocks: true
      rpengine.purge: true
      rpengine.sounds: true
      rpengine.sound: true
      rpengine.icons: true
      rpengine.say: true
      rpengine.screens: true
      rpengine.screen: true
      rpengine.dialogs: true
      rpengine.dialog: true
      rpengine.var: true
      rpengine.page: true
      rpengine.hud: true
      rpengine.shaders: true
      rpengine.shader: true
      rpengine.recipes: true
      rpengine.emote: true
      rpengine.emotes: true
      rpengine.entities: true
      rpengine.spawn: true
      rpengine.bind: true
      rpengine.unbind: true
      rpengine.liquid: true
      rpengine.vehicles: true
      rpengine.vehicle: true
      rpengine.armor: true
      rpengine.edit: true
      rpengine.sync: true
      rpengine.distribute: true
      rpengine.push: true
      rpengine.emote.cast: true
      rpengine.emote.force: true
      rpengine.sound.others: true
      rpengine.screen.others: true
      rpengine.hud.others: true
      rpengine.shader.others: true
      rpengine.dialog.others: true
      rpengine.var.others: true
      rpengine.armor.others: true
      rpengine.bind.others: true
      rpengine.unbind.others: true
  rpengine.reload:
    description: Reload content and config.
    default: op
  rpengine.info:
    description: See what this server holds.
    default: op
  rpengine.bundles:
    description: List the built packs.
    default: op
  rpengine.items:
    description: List the custom items.
    default: op
  rpengine.give:
    description: Give yourself a custom item.
    default: op
  rpengine.blocks:
    description: List the custom blocks, and how many states are left.
    default: op
  rpengine.models:
    description: List placed models nearby.
    default: op
  rpengine.purge:
    description: Remove orphaned placed models.
    default: op
  rpengine.sounds:
    description: List the custom sounds.
    default: op
  rpengine.sound:
    description: Play a custom sound to yourself.
    default: op
  rpengine.sound.others:
    description: Play a custom sound to somebody else.
    default: op
  rpengine.icons:
    description: List the icons.
    default: op
  rpengine.say:
    description: Send yourself text with icons in it.
    default: op
  rpengine.screens:
    description: List the screens and HUDs.
    default: op
  rpengine.screen:
    description: Open a custom screen on yourself.
    default: op
  rpengine.screen.others:
    description: Open a custom screen on somebody else.
    default: op
  rpengine.dialogs:
    description: List the dialogs.
    default: op
  rpengine.dialog:
    description: Open a dialog on yourself - including one about somebody else (target=Steve).
    default: op
  rpengine.dialog.others:
    description: Open a dialog on somebody else's screen.
    default: op
  rpengine.var:
    # Everybody, and it has to be: a click on a bound control in a dialog
    # runs /rp var as the player who clicked it. It can only set a variable
    # some loaded dialog declares, to a value that dialog lists, and only
    # for the player running it - see DialogVariables.
    description: Change your own dialog settings - what a click on a dialog's switch or slider runs.
    default: true
  rpengine.var.others:
    description: Change somebody else's dialog settings.
    default: op
  rpengine.page:
    # Everybody, for rpengine.var's reason: a click on a paged dialog's
    # sidebar runs /rp page as the player who clicked it. It only opens a
    # dialog the one they were last shown links to with exactly that
    # command - see DialogLinks.
    description: Turn a dialog to another of its pages - what a click on a paged dialog's sidebar runs.
    default: true
  rpengine.hud:
    description: Draw a HUD overlay on yourself.
    default: op
  rpengine.hud.others:
    description: Draw or clear a HUD overlay on somebody else.
    default: op
  rpengine.shaders:
    description: List the Studio shader objects.
    default: op
  rpengine.shader:
    description: Show a Studio shader object on yourself.
    default: op
  rpengine.shader.others:
    description: Show or clear a Studio shader object on somebody else.
    default: op
  rpengine.recipes:
    description: List the recipes.
    default: op
  rpengine.emote:
    description: Play an emote.
    default: true
  rpengine.emotes:
    description: List the emotes.
    default: true
  rpengine.entities:
    description: List the custom entities.
    default: op
  rpengine.spawn:
    description: Spawn a custom entity.
    default: op
  rpengine.chat.icons:
    # Quoted, and it has to stay quoted: a plain YAML scalar ends at the first
    # colon-space, so `:name: shortcodes` reads as a nested mapping and the
    # whole file fails to parse. That is not a bad permission line, it is a
    # server that will not boot at all — see PluginYmlTest.
    description: "Use :name: shortcodes for icons in chat."
    default: true
  rpengine.bind:
    description: Put a model on a mob that already exists.
    default: op
  rpengine.bind.others:
    description: Put a model on another PLAYER. A mob needs only rpengine.bind.
    default: op
  rpengine.unbind:
    description: Take a bound model back off.
    default: op
  rpengine.unbind.others:
    description: Take a bound model off another player.
    default: op
  rpengine.liquid:
    description: Mark out pools of a custom liquid.
    default: op
  rpengine.vehicles:
    description: List the vehicles this server has.
    default: op
  rpengine.vehicle:
    description: Park a vehicle, or take one away.
    default: op
  rpengine.armor:
    description: Put on and look at 3D armour yourself.
    default: op
  rpengine.armor.others:
    description: Dress somebody else in 3D armour, or hand them a set.
    default: op
  rpengine.edit:
    description: >
      Open this server's own content in the editors at resourcepack.ai, and
      write what you change back onto this machine. A real permission rather
      than a convenience: whoever has it can rewrite files in the content
      folder from a browser.
    default: op
  rpengine.sync:
    description: Live-test a pack from Studio, and share it.
    default: op
  rpengine.distribute:
    description: Serve a published pack to everybody who joins this server.
    default: op
  rpengine.push:
    description: Re-send this server's pack to yourself.
    default: op
  rpengine.emote.cast:
    description: Pull other players into an emote. They are still asked first.
    default: op
  rpengine.emote.force:
    description: Pull other players in WITHOUT asking them.
    # Not a child of rpengine.emote.cast: holding one is being allowed
    # to ask, holding the other is being allowed to skip the asking,
    # and a server that granted the first has not agreed to the second.
    default: op
