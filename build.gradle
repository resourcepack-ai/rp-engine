plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
// 0.1.0: the id space and the content registry. Nothing loads content yet.
// 0.2.0: the authoring format (FORMAT.md) and its loader.
// 0.3.0: bundles, and a builder that writes one reproducible zip per bundle.
// 0.4.0: serving the built zips, and the per-player bundle stack.
// 0.5.0: it is an installable plugin. plugin.yml, an entrypoint, /rpengine.
// 0.6.0: custom items. Definitions, generated model assets, give and lookup.
// 0.7.0: 3D item models. geometry: names a Blockbench export.
// 0.8.0: models you can put down, and take back.
// 0.9.0: the word is model everywhere. model: names the file, place: puts it
//        down, copy-model: wears somebody else's.
// 0.10.0: right-click fires an event, and placed models can be found and
//         orphans cleaned up.
// 0.11.0: custom sounds.
// 0.12.0: icons. Pictures that behave like letters, and the codepoint
//         allocator that finally had to exist.
// 0.13.0: GUI screens and HUD overlays, on the same glyph mechanism.
// 0.13.1: a screen is positioned from its window geometry, not from a guess.
// 0.14.0: the Inventory label is blanked while a bundle holds a screen.
// 0.14.1: placement comes from the window region, never from the ink.
// 0.15.0: every command completes every argument.
// 0.16.0: a .bbmodel can be used directly, no export step.
// 0.17.0: recipes.
// 0.18.0: studio pairing, so a pack can be live-tested from the panel.
// 0.19.0: a sync can be shared with other players.
// 0.20.0: items fire an event and can carry a permission; the command's one
//         permission node became three.
// 0.21.0: the emote migration begins - triggers and the keyframe sampler.
// 0.22.0: the emote manifest. Nothing plays one yet.
// 0.23.0: the emote director. Nothing is wired to it yet.
// 0.24.0: emotes are wired up. A studio push brings them and /rp emote plays.
// 0.24.1: the emote manifest is slot 3 of a push, not slot 1.
// 0.24.2: a code has to look like one, and claiming it is not the same as
//         being synced.
// 0.25.0: a permission per command, and emotes with a cast ask first.
// 0.26.0: animated model rigs, and the public Models service.
// 0.27.0: skins and notifications, the last two protocol messages.
// 0.28.0: pack distribution, and the Bedrock bridge behind a seam.
// 0.28.1: what the ports lost on the way over.
// 0.29.0: presence, for a server that holds the trusted token.
// 0.30.0: seats, armour, custom entities and liquids.
// 0.31.0: the command layer moves out of the plugin class into six areas,
//         and /emote finally completes its own arguments. The studio
//         callbacks follow it into StudioRelay; the plugin is wiring again.
// 0.32.0: an emote's rig holds what its wearer is holding, and swings it.
//         The hand is a display per hand composed through the arm's own bone
//         chain; the swing is an overlay armed from PlayerAnimationEvent and
//         posed in that same call, not a movement state resolved by the poll.
// 0.32.1: the grip is lifted the 2px it read low by in a client, and the
//         wearer's own copy of their held item stops rendering for them —
//         a packet, so the item is still really in their hand.
// 0.32.2: the blank follows the slot in their hand, so a slot they scroll
//         away from gets its item back mid-emote.
// 0.33.0: a pushed pack's sounds and screens are registry content, so the
//         panel's in-game buttons name an id like everything else. bind
//         becomes distribute.
// 0.34.0: /rp is a help menu rather than eight lines of pipe-separated
//         names, and the lines come off the areas so a subcommand cannot
//         exist without one.
// 0.35.0: a pushed pack is served from the address studio signed, not
//         re-served from a host address nobody configured.
// 0.36.0: the help fits on a line of chat. Minecraft's font is not
//         monospace, so there are no columns to line up any more.
// 0.37.0: a push addressed by uuid reaches the player it names. Studio
//         addresses a sync that way the moment it has more than one
//         recipient, and always for a skin or a notification.
// 0.38.0: an emote leaves the wearer's own hand alone. Their item is really
//         in it — a bow draws, a potion drinks, the hotbar slot is theirs —
//         because the rig's copy is hidden from them rather than theirs from
//         everyone. The rig also casts a shadow and its cape trails, both
//         from vanilla's own numbers, and it tells studio which cape that
//         is — the one answer to that only a game server holds.
// 0.39.0: a worn set is hidden from its wearer rather than its wearer from
//         the world, so their first person is vanilla and the rig is what
//         everybody else sees. The rig's own held item is turned in the
//         item's frame, not in model space, where the display-space
//         conjugation was pitching it a half turn off the grip.
// 0.40.0: /emote <name> --showYourself lets a set's wearer watch it, for
//         authoring one without a second account — testing only, since a
//         rig is a server entity and the body it stands in for is not. The
//         rig's shadow also takes the same lead as the rig, having trailed
//         it by up to two thirds of a block for as long as a set was walked
//         around.
// 0.40.1: no code change over 0.40.0 — a version-only republish. Recorded
//         rather than left as a gap, since a missing number in this list
//         reads as a lost entry.
// 0.40.2: an emote that walks its player carries its shadow and its nametag
//         with it. Root motion moves the rig by transform, which geometry
//         follows and an entity-positioned shadow or a billboarded name
//         cannot, so both stayed on the start line until the emote ended.
// 0.40.3: the rig's held item stops facing backwards. Vanilla's in-hand turn
//         ends with a half turn about Y that an ItemDisplay already does for
//         itself, so copying the pair whole spent it twice — invisible on a
//         rig standing still, a sword held backwards once an arm swung.
// 0.41.0: the chat palette is config rather than four hard-coded prefixes,
//         and #3670f8 by default.
// 0.42.0: a hand-authored model animates, through the rig a studio push
//         already used - so the one thing that only worked with studio in
//         the picture no longer does. Items get a closed list of actions,
//         because "you get an event" is nothing to a server with nobody to
//         write the plugin. A model can be bound to an entity somebody else
//         spawned, which is what servers pay ModelEngine for, and MythicMobs
//         can do it from a skill line. Placeholders, so the rest of a server
//         can read what the engine knows. And both ends of a sync invite
//         hear the answer.
// 0.43.0: a rig is a tree. A part composes its whole animated ancestor
//         chain, so rotating a torso carries the arms inside it, and a bone
//         holding only other bones is a bone. Both builders had flattened it
//         and agreed on the wrong answer. Animations gain a speed, an end
//         (loop/hold/once), a priority and a crossfade. Items gain the
//         vanilla numbers — enchantments, attributes, durability, food — and
//         four more triggers. Typing :wave: in chat draws the icon.
// 0.44.0: bones can do things, with ModelEngine's own name prefixes so a rig
//         somebody already has works unchanged: heads that track a target,
//         sub-hitboxes, seats, nametags. Placed pieces can light a room,
//         stick to a wall or a ceiling, and drop something other than
//         themselves. Items can be worn as hats and kept through dying.
//         WorldGuard gets two region flags, built on events the engine
//         already fired.
// 0.45.0: two animations at once. A layer above the base composes on top of
//         it rather than replacing it, so a wave plays over a walk cycle;
//         the base path is untouched, so every rig already in the world
//         behaves as it did. A Citizens NPC keeps its model across the
//         despawn and respawn that binding alone could not survive.
// 0.46.0: a layer can move part of a model. weight scales how far it moves
//         what it touches; bones names which bones it touches at all, and
//         reaches everything hanging off them. A b_ bone can also say what a
//         hit on it is multiplied by — the pack's rule rather than ours.
// 0.46.1: an audit of everything the last three versions added, none of
//         which has been in a client. Six real defects, all of the kind that
//         accumulate quietly: two maps that grew for ever, derived entities
//         saved with their chunk, a light block deleted that was not ours, a
//         hidden name never restored, and items kept through death handed
//         back into an inventory that was about to be cleared.
// 0.46.2: the 0.40.2 and 0.40.3 emote fixes reach the 0.46 line. They were
//         cut from a branch that had not seen 0.41.0 onwards, so no released
//         jar has carried both the moving rig's shadow and nametag and the
//         corrected in-hand turn until this one.
// 0.46.3: the rig's held item stops reading flipped to everybody but its
//         wearer. 0.40.3 deleted the Y half of vanilla's in-hand turn on the
//         grounds that an ItemDisplay already carries it — but that half turn
//         commutes with the conjugation it was said to be doubled by, so it
//         contributed the same 180 either side of the move that supposedly
//         made it redundant. It is a roll about the item's own length, which
//         cannot cause the backwards-facing item it was deleted over, and its
//         absence is the horizontal flip everybody else could see.
// 0.46.4: the server boots. 0.43.0 added a permission whose description reads
//         "Use :name: shortcodes for icons in chat" unquoted, and a plain YAML
//         scalar ends at the first colon-space — so plugin.yml did not parse,
//         Paper threw InvalidDescriptionException before enabling anything,
//         and every plugin on the box went down with it. Nothing had ever
//         looked at this file: it is a resource, the build only substitutes
//         the version into it, and no test loaded it. PluginYmlTest does now.
// 0.46.5: a server without WorldGuard loads the plugin again. The four
//         optional integrations each checked for their plugin INSIDE the hook
//         class, which cannot work: naming a type in a field or a catch clause
//         means calling into that class loads and verifies it, so a server
//         with no WorldGuard threw NoClassDefFoundError out of onLoad before
//         the check could run — and a plugin that throws from onLoad is never
//         enabled. The check moves out to the call site, where the class is
//         not touched at all if the plugin is absent.
// 0.46.6: nobody sees their own nametag over their own rig — vanilla never
//         shows you your own nameplate, and a one-shot emote was leaving the
//         rig's copy of it hanging in front of its wearer. The held item's
//         turn becomes Rx(+90): vanilla's pitch has the opposite sign in a
//         y-up frame, and lifting its in-hand pair verbatim is what pointed
//         the blade at the rig's own back. The turn is also settable from
//         config now, because it has been wrong four times and no test can
//         see a rig.
// 0.46.7: an emote's nametag stops disappearing behind a model. A TextDisplay
//         with see-through off is depth-tested, so anything in front of it —
//         a placed model, the rig itself — hides it, and vanilla only draws a
//         name that way while its owner is CROUCHING. Two things set it that
//         way while nobody was crouching: a one-shot read the wearer's crouch
//         at spawn and then never updated it again, and carryFollowers wrote
//         the crouch field directly rather than through the setter that owns
//         setSeeThrough and setViewRange, latching the mismatch for the rest
//         of the emote. A one-shot's rig does not crouch with its wearer at
//         all, so it no longer pretends to — which also lifts the name back
//         out of the model's head.
// 0.46.8: an emote's nametag stops vanishing in front of a model. 0.46.7 had
//         the mechanism backwards: see-through text is drawn with no depth
//         test AND no depth write, so it is not drawn OVER anything — whatever
//         the client draws after it paints over it, and a nearby model wins
//         that race. Depth-tested text is drawn when it is genuinely in front,
//         which is the property that matters next to models. The cost is
//         vanilla's other half, names through terrain, and it is settable
//         because it is a rendering judgement rather than a fact.
// 0.47.0: three days of work, and the first release with the integration
//         harness behind it (integration/, `node integration/run.mjs`) — a
//         second plugin that drives this one against a real Paper server.
//         Two of the defects below were caught by it and by nothing else.
//
//         LIQUIDS gain a colour of their own, written as one generated biome
//         per tinted liquid and applied over a pool. A biome is registered at
//         startup, so a new colour needs a restart and the engine says so.
//         An item can be a bucket of one (`liquid:`), and a placed block joins
//         the pool it touches rather than starting a second.
//
//         CUSTOM BLOCKS, reversing the decision that they were not happening.
//         A note block or mushroom stem in a spare state wearing your model,
//         mineable with real hardness and a real tool requirement, because the
//         engine breaks its own blocks. Identity is the note and the powered
//         flag and NOT the instrument: the game recomputes that from the block
//         beneath, inside a shape update no event can refuse, which the
//         harness proved by putting hay under one. 49 per note block, 63 per
//         mushroom stem, and blocks.json must never be lost.
//
//         ITEMSADDER AND MODELENGINE PACKS LOAD AS THEY COME. An IA config is
//         recognised by its own shape and translated at load — items, blocks,
//         font images, recipes, entities. A ModelEngine blueprints/ folder
//         gives one item per .bbmodel; nothing is converted, because their
//         bone prefixes were already ours.
//
//         SEVEN NEW EVENTS: ContentLoad, PackSend, ModelSeat, ModelBind,
//         ModelAnimationEnd, EntityDeath and PlayerLiquid — the list checked
//         against what both of those plugins fire.
//
//         TOML is read wherever YAML is. A command named in a chat message is
//         clickable. /emote can be turned off. A seat takes x, y and z, and a
//         global nudge for how the game draws sitting.
//
//         Two fixes worth their own line: a right-click into the air did
//         nothing at all, because Bukkit builds that event pre-cancelled and
//         the listener ignored cancelled ones; and a chair sat you two and a
//         half blocks into the floor, because a marker armour stand's rider
//         sits 0.7 BELOW it rather than 1.75 above.
version = '0.47.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    // Geyser, for the Bedrock bridge.
    maven { url = 'https://repo.opencollab.dev/main/' }
    // PlaceholderAPI, for the expansion. Its own repository; it is not on
    // Maven Central.
    maven { url = 'https://repo.extendedclip.com/releases/' }
    // MythicMobs, for the model mechanic. Its own repository too.
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    // WorldGuard, for the region flags.
    maven { url = 'https://maven.enginehub.org/repo/' }
    // Citizens, for the NPC trait.
    maven { url = 'https://repo.citizensnpcs.co/' }
}

dependencies {
    // 1.21.4 is the floor and it is load-bearing, not conservatism: the whole
    // id scheme rests on the string-valued minecraft:item_model component,
    // which arrived in 1.21.4. See the design notes, "The id scheme".
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'

    // Geyser for the Bedrock bridge: per-session pack serving and
    // transfer-based reconnects. compileOnly on purpose — at runtime the
    // classes come from the server's own Geyser-Spigot, and everything that
    // touches them goes through BedrockSupport, which answers no on a server
    // that has none rather than throwing NoClassDefFoundError somewhere
    // unrelated.
    // PlaceholderAPI. compileOnly for the same reason Geyser is: a server
    // without it must load this plugin normally, so every reference to it is
    // behind Placeholders, which registers only when the class is there.
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // MythicMobs. compileOnly for the same reason as the other two.
    compileOnly 'io.lumine:Mythic-Dist:5.12.1'

    // WorldGuard. compileOnly, same as the rest.
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'

    // Citizens. compileOnly, same as the rest.
    // transitive = false: Citizens pulls a library loader that is not on any
    // repository we can reach, and none of it is needed to compile against a
    // Trait. The classes come from the server's own Citizens at runtime.
    compileOnly('net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT') { transitive = false }

    compileOnly 'org.geysermc.geyser:api:2.11.0-SNAPSHOT'
    compileOnly 'org.geysermc.geyser:core:2.11.0-SNAPSHOT'

    // The websocket client for studio pairing. Shaded, so a server owner still
    // installs one jar, and relocated so this plugin cannot be the reason
    // another plugin's copy of it stops working.
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'

    // TOML, for content files written in it. night-config rather than tomlj:
    // tomlj is a full TOML 1.0 implementation that drags in the ANTLR runtime,
    // which is more megabytes than this whole plugin for a file format that is
    // an alternative spelling of the one we already read.
    implementation 'com.electronwill.night-config:toml:3.8.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keeps real parameter names in the bytecode, so a consumer's IDE shows
    // the argument names this API's javadoc talks about.
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
}

processResources {
    // Load-bearing: expand() reads project.version at execution time and Gradle
    // cannot see that, so without this input the task stays UP-TO-DATE across a
    // version bump and ships a plugin.yml claiming the old version.
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.java_websocket', 'ai.resourcepack.engine.libs.java_websocket'
    relocate 'com.electronwill.nightconfig', 'ai.resourcepack.engine.libs.nightconfig'
    // ai.resourcepack.engine.* is deliberately NOT relocated: a third-party
    // plugin compiles against ai.resourcepack.engine.api and needs the classes
    // where its imports say they are.
}

build {
    dependsOn shadowJar
}

// Drops the built jar straight into a local test server. Development only —
// production deploys are a different problem and do not belong in a Gradle
// task somebody could run by accident.
//
// The path is overridable so this is not hardcoded to one machine:
//   ./gradlew deployToServer -PserverDir="D:/servers/test"
//   RPENGINE_SERVER=/srv/test ./gradlew deployToServer
def serverDir = project.findProperty('serverDir')
        ?: System.getenv('RPENGINE_SERVER')
        ?: 'C:/Users/steph/Desktop/RPAI Test'

tasks.register('deployToServer', Copy) {
    group = 'rp-engine'
    description = 'Builds the plugin and copies it into a local test server.'
    dependsOn shadowJar
    from shadowJar.archiveFile
    into file("${serverDir}/plugins")
    // A fixed name, so a version bump does not leave two jars in the folder
    // and a server loading both.
    rename { 'RPEngine.jar' }
    doLast {
        logger.lifecycle("RPEngine.jar -> ${serverDir}/plugins")
    }
}

// ---------------------------------------------------------------------------
// The integration harness.
//
// A second, tiny plugin that drives this one against a REAL server, because
// the things most likely to be wrong here cannot be reached from a unit test:
// a biome the server has to accept, a chunk that has to be re-sent, a command
// withdrawn from a map that only CraftBukkit has. Two of those were wrong when
// this was first written, and both passed every test in src/test.
//
// It is built as its own jar rather than being part of the plugin, so nothing
// under src/main can accidentally depend on it and no released jar carries it.
// `node integration/run.mjs` is the entry point; see integration/README.md.
// ---------------------------------------------------------------------------
sourceSets {
    harness {
        java.srcDirs = ['integration/src']
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

tasks.register('harnessJar', Jar) {
    group = 'rp-engine'
    description = 'Builds the integration harness plugin.'
    dependsOn classes
    archiveFileName = 'RPEngineHarness.jar'
    from sourceSets.harness.output
    from('integration/resources')
}
