import org.gradle.api.attributes.java.TargetJvmVersion

plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
// Bump this before deploying a release: the deploy refuses to overwrite a
// published RPEngine-<version>.jar, and the versioned key is immutable.
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

// The bytecode this jar ships, which is a different question from the JDK
// that builds it above.
//
// It is 17 because the engine supports Minecraft 1.19.4, and a 1.19.4 server
// runs on Java 17. A Java 17 runtime cannot load a Java 21 class file at all
// — the jar does not start, there is no partial mode and no useful error for
// the server owner, and every graceful degradation the version system does is
// moot if the plugin never loads. So this number is a floor set by the oldest
// game version supported, and it moves only when that does.
tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Geyser's jars are built for Java 21 and say so, which makes Gradle refuse
// to put them on a classpath targeting 17. Both are compileOnly and only
// GeyserBridge touches them, and that class is reached exactly once — behind
// a check that Geyser-Spigot is installed, inside a catch for
// NoClassDefFoundError. A server running Geyser is a server on Java 21 by
// Geyser's own requirement, so the classes it needs are loadable wherever it
// is loaded at all, and on every other server it is never loaded.
//
// So the constraint Gradle is enforcing here is real for Geyser and not for
// us. Overriding it on the compile classpaths only: the bytecode this
// produces is still 17, which is the thing that actually has to be true.
configurations.configureEach {
    if (name.toLowerCase().endsWith('compileclasspath')) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    // Geyser, for the Bedrock bridge.
    maven { url = 'https://repo.opencollab.dev/main/' }
    // PlaceholderAPI, for the expansion. Its own repository; it is not on
    // Maven Central.
    maven { url = 'https://repo.extendedclip.com/releases/' }
    // MythicMobs, for the model mechanic. Its own repository too.
    maven { url = 'https://mvn.lumine.io/repository/maven-public/' }
    // WorldGuard, for the region flags.
    maven { url = 'https://maven.enginehub.org/repo/' }
    // Citizens, for the NPC trait.
    maven { url = 'https://repo.citizensnpcs.co/' }
}

dependencies {
    // 1.21.4 is the floor and it is load-bearing, not conservatism: the whole
    // id scheme rests on the string-valued minecraft:item_model component,
    // which arrived in 1.21.4. See the design notes, "The id scheme".
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'

    // Geyser for the Bedrock bridge: per-session pack serving and
    // transfer-based reconnects. compileOnly on purpose — at runtime the
    // classes come from the server's own Geyser-Spigot, and everything that
    // touches them goes through BedrockSupport, which answers no on a server
    // that has none rather than throwing NoClassDefFoundError somewhere
    // unrelated.
    // PlaceholderAPI. compileOnly for the same reason Geyser is: a server
    // without it must load this plugin normally, so every reference to it is
    // behind Placeholders, which registers only when the class is there.
    compileOnly 'me.clip:placeholderapi:2.11.6'

    // MythicMobs. compileOnly for the same reason as the other two.
    compileOnly 'io.lumine:Mythic-Dist:5.12.1'

    // WorldGuard. compileOnly, same as the rest.
    compileOnly 'com.sk89q.worldguard:worldguard-bukkit:7.0.9'

    // Citizens. compileOnly, same as the rest.
    // transitive = false: Citizens pulls a library loader that is not on any
    // repository we can reach, and none of it is needed to compile against a
    // Trait. The classes come from the server's own Citizens at runtime.
    compileOnly('net.citizensnpcs:citizens-main:2.0.35-SNAPSHOT') { transitive = false }

    compileOnly 'org.geysermc.geyser:api:2.11.0-SNAPSHOT'
    compileOnly 'org.geysermc.geyser:core:2.11.0-SNAPSHOT'

    // The websocket client for studio pairing. Shaded, so a server owner still
    // installs one jar, and relocated so this plugin cannot be the reason
    // another plugin's copy of it stops working.
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'

    // TOML, for content files written in it. night-config rather than tomlj:
    // tomlj is a full TOML 1.0 implementation that drags in the ANTLR runtime,
    // which is more megabytes than this whole plugin for a file format that is
    // an alternative spelling of the one we already read.
    implementation 'com.electronwill.night-config:toml:3.8.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keeps real parameter names in the bytecode, so a consumer's IDE shows
    // the argument names this API's javadoc talks about.
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
}

processResources {
    // Load-bearing: expand() reads project.version at execution time and Gradle
    // cannot see that, so without this input the task stays UP-TO-DATE across a
    // version bump and ships a plugin.yml claiming the old version.
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.java_websocket', 'ai.resourcepack.engine.libs.java_websocket'
    relocate 'com.electronwill.nightconfig', 'ai.resourcepack.engine.libs.nightconfig'
    // ai.resourcepack.engine.* is deliberately NOT relocated: a third-party
    // plugin compiles against ai.resourcepack.engine.api and needs the classes
    // where its imports say they are.
}

build {
    dependsOn shadowJar
}

// Drops the built jar straight into a local test server. Development only —
// production deploys are a different problem and do not belong in a Gradle
// task somebody could run by accident.
//
// The path is overridable so this is not hardcoded to one machine:
//   ./gradlew deployToServer -PserverDir="D:/servers/test"
//   RPENGINE_SERVER=/srv/test ./gradlew deployToServer
def serverDir = project.findProperty('serverDir')
        ?: System.getenv('RPENGINE_SERVER')
        ?: 'C:/Users/steph/Desktop/RPAI Test'

tasks.register('deployToServer', Copy) {
    group = 'rp-engine'
    description = 'Builds the plugin and copies it into a local test server.'
    dependsOn shadowJar
    from shadowJar.archiveFile
    into file("${serverDir}/plugins")
    // A fixed name, so a version bump does not leave two jars in the folder
    // and a server loading both.
    rename { 'RPEngine.jar' }
    doLast {
        logger.lifecycle("RPEngine.jar -> ${serverDir}/plugins")
    }
}

// ---------------------------------------------------------------------------
// The integration harness.
//
// A second, tiny plugin that drives this one against a REAL server, because
// the things most likely to be wrong here cannot be reached from a unit test:
// a biome the server has to accept, a chunk that has to be re-sent, a command
// withdrawn from a map that only CraftBukkit has. Two of those were wrong when
// this was first written, and both passed every test in src/test.
//
// It is built as its own jar rather than being part of the plugin, so nothing
// under src/main can accidentally depend on it and no released jar carries it.
// `node integration/run.mjs` is the entry point; see integration/README.md.
// ---------------------------------------------------------------------------
sourceSets {
    harness {
        java.srcDirs = ['integration/src']
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
    }
}

tasks.register('harnessJar', Jar) {
    group = 'rp-engine'
    description = 'Builds the integration harness plugin.'
    dependsOn classes
    archiveFileName = 'RPEngineHarness.jar'
    from sourceSets.harness.output
    from('integration/resources')
}

// The version the engine's floor is, as an API coordinate. One place, because
// the audit below and anybody reading this both need to know which version
// "oldest supported" currently means. Matches McVersion.OLDEST_SUPPORTED.
ext.oldestSupportedApi = '1.19.4-R0.1-SNAPSHOT'

apply from: 'gradle/oldest-api-audit.gradle'
