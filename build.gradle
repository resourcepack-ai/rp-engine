plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'ai.resourcepack'
// 0.1.0: the id space and the content registry. Nothing loads content yet.
// 0.2.0: the authoring format (FORMAT.md) and its loader.
// 0.3.0: bundles, and a builder that writes one reproducible zip per bundle.
// 0.4.0: serving the built zips, and the per-player bundle stack.
// 0.5.0: it is an installable plugin. plugin.yml, an entrypoint, /rpengine.
// 0.6.0: custom items. Definitions, generated model assets, give and lookup.
// 0.7.0: 3D item models. geometry: names a Blockbench export.
// 0.8.0: models you can put down, and take back.
// 0.9.0: the word is model everywhere. model: names the file, place: puts it
//        down, copy-model: wears somebody else's.
// 0.10.0: right-click fires an event, and placed models can be found and
//         orphans cleaned up.
// 0.11.0: custom sounds.
// 0.12.0: icons. Pictures that behave like letters, and the codepoint
//         allocator that finally had to exist.
// 0.13.0: GUI screens and HUD overlays, on the same glyph mechanism.
// 0.13.1: a screen is positioned from its window geometry, not from a guess.
// 0.14.0: the Inventory label is blanked while a bundle holds a screen.
// 0.14.1: placement comes from the window region, never from the ink.
// 0.15.0: every command completes every argument.
// 0.16.0: a .bbmodel can be used directly, no export step.
// 0.17.0: recipes.
// 0.18.0: studio pairing, so a pack can be live-tested from the panel.
// 0.19.0: a sync can be shared with other players.
// 0.20.0: items fire an event and can carry a permission; the command's one
//         permission node became three.
// 0.21.0: the emote migration begins - triggers and the keyframe sampler.
// 0.22.0: the emote manifest. Nothing plays one yet.
// 0.23.0: the emote director. Nothing is wired to it yet.
// 0.24.0: emotes are wired up. A studio push brings them and /rp emote plays.
// 0.24.1: the emote manifest is slot 3 of a push, not slot 1.
// 0.24.2: a code has to look like one, and claiming it is not the same as
//         being synced.
// 0.25.0: a permission per command, and emotes with a cast ask first.
// 0.26.0: animated model rigs, and the public Models service.
// 0.27.0: skins and notifications, the last two protocol messages.
// 0.28.0: pack distribution, and the Bedrock bridge behind a seam.
// 0.28.1: what the ports lost on the way over.
// 0.29.0: presence, for a server that holds the trusted token.
// 0.30.0: seats, armour, custom entities and liquids.
// 0.31.0: the command layer moves out of the plugin class into six areas,
//         and /emote finally completes its own arguments. The studio
//         callbacks follow it into StudioRelay; the plugin is wiring again.
// 0.32.0: an emote's rig holds what its wearer is holding, and swings it.
//         The hand is a display per hand composed through the arm's own bone
//         chain; the swing is an overlay armed from PlayerAnimationEvent and
//         posed in that same call, not a movement state resolved by the poll.
// 0.32.1: the grip is lifted the 2px it read low by in a client, and the
//         wearer's own copy of their held item stops rendering for them —
//         a packet, so the item is still really in their hand.
// 0.32.2: the blank follows the slot in their hand, so a slot they scroll
//         away from gets its item back mid-emote.
// 0.33.0: a pushed pack's sounds and screens are registry content, so the
//         panel's in-game buttons name an id like everything else. bind
//         becomes distribute.
// 0.34.0: /rp is a help menu rather than eight lines of pipe-separated
//         names, and the lines come off the areas so a subcommand cannot
//         exist without one.
// 0.35.0: a pushed pack is served from the address studio signed, not
//         re-served from a host address nobody configured.
// 0.36.0: the help fits on a line of chat. Minecraft's font is not
//         monospace, so there are no columns to line up any more.
// 0.37.0: a push addressed by uuid reaches the player it names. Studio
//         addresses a sync that way the moment it has more than one
//         recipient, and always for a skin or a notification.
// 0.38.0: an emote leaves the wearer's own hand alone. Their item is really
//         in it — a bow draws, a potion drinks, the hotbar slot is theirs —
//         because the rig's copy is hidden from them rather than theirs from
//         everyone. The rig also casts a shadow and its cape trails, both
//         from vanilla's own numbers, and it tells studio which cape that
//         is — the one answer to that only a game server holds.
version = '0.38.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    // Geyser, for the Bedrock bridge.
    maven { url = 'https://repo.opencollab.dev/main/' }
}

dependencies {
    // 1.21.4 is the floor and it is load-bearing, not conservatism: the whole
    // id scheme rests on the string-valued minecraft:item_model component,
    // which arrived in 1.21.4. See the design notes, "The id scheme".
    compileOnly 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'

    // Geyser for the Bedrock bridge: per-session pack serving and
    // transfer-based reconnects. compileOnly on purpose — at runtime the
    // classes come from the server's own Geyser-Spigot, and everything that
    // touches them goes through BedrockSupport, which answers no on a server
    // that has none rather than throwing NoClassDefFoundError somewhere
    // unrelated.
    compileOnly 'org.geysermc.geyser:api:2.11.0-SNAPSHOT'
    compileOnly 'org.geysermc.geyser:core:2.11.0-SNAPSHOT'

    // The websocket client for studio pairing. Shaded, so a server owner still
    // installs one jar, and relocated so this plugin cannot be the reason
    // another plugin's copy of it stops working.
    implementation 'org.java-websocket:Java-WebSocket:1.5.7'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.spigotmc:spigot-api:1.21.4-R0.1-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Keeps real parameter names in the bytecode, so a consumer's IDE shows
    // the argument names this API's javadoc talks about.
    options.compilerArgs << '-parameters'
}

test {
    useJUnitPlatform()
}

processResources {
    // Load-bearing: expand() reads project.version at execution time and Gradle
    // cannot see that, so without this input the task stays UP-TO-DATE across a
    // version bump and ships a plugin.yml claiming the old version.
    inputs.property('version', project.version)
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier.set('')
    relocate 'org.java_websocket', 'ai.resourcepack.engine.libs.java_websocket'
    // ai.resourcepack.engine.* is deliberately NOT relocated: a third-party
    // plugin compiles against ai.resourcepack.engine.api and needs the classes
    // where its imports say they are.
}

build {
    dependsOn shadowJar
}

// Drops the built jar straight into a local test server. Development only —
// production deploys are a different problem and do not belong in a Gradle
// task somebody could run by accident.
//
// The path is overridable so this is not hardcoded to one machine:
//   ./gradlew deployToServer -PserverDir="D:/servers/test"
//   RPENGINE_SERVER=/srv/test ./gradlew deployToServer
def serverDir = project.findProperty('serverDir')
        ?: System.getenv('RPENGINE_SERVER')
        ?: 'C:/Users/steph/Desktop/RPAI Test'

tasks.register('deployToServer', Copy) {
    group = 'rp-engine'
    description = 'Builds the plugin and copies it into a local test server.'
    dependsOn shadowJar
    from shadowJar.archiveFile
    into file("${serverDir}/plugins")
    // A fixed name, so a version bump does not leave two jars in the folder
    // and a server loading both.
    rename { 'RPEngine.jar' }
    doLast {
        logger.lifecycle("RPEngine.jar -> ${serverDir}/plugins")
    }
}
